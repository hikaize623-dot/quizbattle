<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scholar Slayer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #070512;
      --purple: #171036;
      --gold: #ffd770;
      --white: #ffffff;
      --red: #ff5470;
      --green: #34e0a1;
      --black: #000000;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
      background: var(--navy);
      color: var(--white);
      font-family: 'Press Start 2P', cursive;
      font-size: 14px;
      -webkit-font-smoothing: none;
    }

    button {
      font-family: 'Press Start 2P', cursive;
      cursor: pointer;
      background: var(--black);
      color: var(--white);
      border: 4px solid var(--white);
      padding: 12px;
      font-size: 12px;
      transition: transform 0.1s;
    }

    button:active:not(:disabled) {
      transform: translateY(4px);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    input {
      font-family: 'Press Start 2P', cursive;
    }

    .stars-bg {
      position: absolute;
      inset: 0;
      z-index: -1;
      background-image:
        radial-gradient(2px 2px at 20% 30%, #fff, transparent),
        radial-gradient(2px 2px at 70% 60%, #fff, transparent),
        radial-gradient(1px 1px at 40% 80%, #fff, transparent),
        radial-gradient(2px 2px at 85% 25%, var(--gold), transparent),
        radial-gradient(1px 1px at 10% 65%, #fff, transparent);
      background-size: 400px 400px;
      animation: drift 40s linear infinite;
      opacity: 0.6;
    }

    @keyframes drift {
      from {
        background-position: 0 0;
      }

      to {
        background-position: 400px 400px;
      }
    }

    .screen {
      display: none;
      flex-direction: column;
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      height: 100%;
      padding: 16px;
      position: relative;
      z-index: 1;
    }

    .screen.active {
      display: flex;
    }

    #titleScreen {
      align-items: center;
      justify-content: center;
      gap: 40px;
    }

    .game-title {
      font-size: 48px;
      color: var(--gold);
      text-align: center;
      text-shadow: 4px 4px var(--black);
      margin: 0;
      line-height: 1.2;
    }

    .name-input {
      background: var(--black);
      border: 4px solid var(--white);
      padding: 16px;
      font-size: 16px;
      color: var(--gold);
      text-align: center;
      outline: none;
      width: 100%;
      max-width: 300px;
    }

    .name-input:focus {
      border-color: var(--gold);
    }

    .start-btn {
      font-size: 20px;
      padding: 16px 32px;
      color: var(--gold);
      border-color: var(--gold);
    }

    #battleScreen {
      gap: 16px;
    }

    .hp-top {
      display: flex;
      gap: 16px;
      flex-shrink: 0;
    }

    .hp-box {
      flex: 1;
      background: var(--purple);
      border: 4px solid var(--white);
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .hp-label {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--gold);
    }

    .hp-bar-bg {
      height: 16px;
      background: var(--black);
      border: 2px solid var(--white);
      padding: 2px;
    }

    .hp-bar-fill {
      height: 100%;
      transition: width 0.2s;
    }

    .hp-bar-fill.red {
      background: var(--red);
    }

    .hp-bar-fill.green {
      background: var(--green);
    }

    .battle-mid {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-height: 0;
    }

    .arena {
      flex: 1;
      background: var(--black);
      border: 4px solid var(--white);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }



    .boss-wrap {
      width: 300px;
      height: 300px;
      z-index: 2;
      animation: bounce 1s steps(2, end) infinite;
      transform-origin: bottom center;
      margin-bottom: 60px;
    }

    .boss-wrap svg {
      width: 100%;
      height: 100%;
    }

    @keyframes bounce {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-8px);
      }
    }

    .boss-wrap.hit {
      animation: bossHit 0.2s steps(2, end);
    }

    @keyframes bossHit {

      0%,
      100% {
        transform: translateX(0);
        filter: brightness(1);
      }

      50% {
        transform: translateX(-16px);
        filter: brightness(2) contrast(2);
      }
    }

    .boss-wrap.attack {
      animation: bossAttack 0.2s steps(2, end);
    }

    @keyframes bossAttack {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.2) translateY(16px);
      }
    }

    .boss-wrap.defeat {
      animation: bossDefeat 1s forwards steps(4, end);
    }

    @keyframes bossDefeat {
      0% {
        opacity: 1;
        filter: none;
      }

      100% {
        transform: translateY(60px);
        opacity: 0;
        filter: grayscale(1);
      }
    }

    .damage-num {
      position: absolute;
      top: 30%;
      font-size: 24px;
      color: var(--gold);
      text-shadow: 2px 2px var(--black);
      animation: floatUp 1s steps(4, end) forwards;
      z-index: 3;
      pointer-events: none;
    }

    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translateY(0);
      }

      100% {
        opacity: 0;
        transform: translateY(-40px);
      }
    }

    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--purple);
      border: 4px solid var(--white);
      padding: 8px 12px;
      flex-shrink: 0;
      font-size: 12px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .score-box {
      color: var(--gold);
    }

    .combo-box {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .combo-dots {
      display: flex;
      gap: 4px;
    }

    .combo-dot {
      width: 12px;
      height: 12px;
      background: var(--black);
      border: 2px solid var(--white);
    }

    .combo-dot.on {
      background: var(--gold);
      border-color: var(--gold);
    }

    .spells {
      display: flex;
      gap: 8px;
    }

    .spell {
      padding: 4px;
      font-size: 16px;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .quiz-area {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .timer-wrap {
      height: 12px;
      background: var(--black);
      border: 2px solid var(--white);
      padding: 2px;
    }

    .timer-fill {
      height: 100%;
      background: var(--white);
      transition: width 0.1s linear;
    }

    .question-box {
      background: var(--purple);
      border: 4px solid var(--white);
      padding: 16px;
      font-family: 'Press Start 2P', cursive;
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .option {
      font-family: 'Press Start 2P', cursive;
      font-size: 10px;
      padding: 12px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 12px;
      line-height: 1.4;
    }

    .option:hover:not(:disabled) {
      border-color: var(--gold);
      color: var(--gold);
    }

    .option .key {
      width: 24px;
      height: 24px;
      background: var(--white);
      color: var(--black);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      flex-shrink: 0;
    }

    .option.eliminated {
      opacity: 0.2;
      pointer-events: none;
      text-decoration: line-through;
    }

    .option.correct {
      background: var(--green);
      border-color: var(--white);
      color: var(--black);
    }

    .option.correct .key {
      background: var(--black);
      color: var(--white);
    }

    .option.wrong {
      background: var(--red);
      border-color: var(--white);
    }

    #resultScreen {
      align-items: center;
      justify-content: center;
      gap: 32px;
      text-align: center;
    }

    .result-title {
      font-size: 48px;
      margin: 0;
      text-shadow: 4px 4px var(--black);
    }

    .result-title.victory {
      color: var(--gold);
    }

    .result-title.defeat {
      color: var(--red);
    }

    .result-stats {
      background: var(--purple);
      border: 4px solid var(--white);
      padding: 24px;
      font-size: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 400px;
      text-align: left;
      margin: 0 auto;
    }

    .result-stats span {
      color: var(--gold);
      float: right;
    }

    .result-actions {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .result-actions button {
      font-size: 16px;
      padding: 16px 24px;
    }

    .flash-green {
      animation: flashGreen 0.3s;
    }

    @keyframes flashGreen {

      0%,
      100% {
        background: var(--black);
      }

      50% {
        background: var(--green);
      }
    }

    .flash-red {
      animation: flashRed 0.3s;
    }

    @keyframes flashRed {

      0%,
      100% {
        background: var(--black);
      }

      50% {
        background: var(--red);
      }
    }

    .shake-screen {
      animation: screenShake 0.4s;
    }

    @keyframes screenShake {

      0%,
      100% {
        transform: translate(0, 0);
      }

      20% {
        transform: translate(-8px, 4px);
      }

      40% {
        transform: translate(8px, -4px);
      }

      60% {
        transform: translate(-8px, -4px);
      }

      80% {
        transform: translate(8px, 4px);
      }
    }

    @media (max-width: 600px) {
      .game-title {
        font-size: 32px;
      }

      .stats-bar {
        justify-content: center;
      }

      .options-grid {
        grid-template-columns: 1fr;
      }

      .option {
        padding: 10px;
      }
    }

    /* Selection Screen */
    #selectionScreen {
      align-items: center;
      justify-content: flex-start;
      padding-top: 40px;
    }

    .select-section-title {
      font-size: 16px;
      color: var(--gold);
      text-align: center;
      margin: 24px 0 12px;
    }

    .select-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 500px;
    }

    .select-grid.two-cols {
      grid-template-columns: repeat(2, 1fr);
    }

    .select-btn {
      background: var(--purple);
      color: var(--white);
      border: 4px solid var(--white);
      padding: 16px 8px;
      font-size: 12px;
      text-align: center;
    }

    .select-btn:hover:not(:disabled) {
      border-color: var(--gold);
      color: var(--gold);
    }

    .select-btn.active {
      background: var(--gold);
      color: var(--black);
      border-color: var(--gold);
    }

    .select-btn:disabled {
      opacity: 0.2;
      cursor: not-allowed;
    }
  </style>
</head>

<body>
  <div class="stars-bg"></div>

  <div id="titleScreen" class="screen active">
    <h1 class="game-title">SCHOLAR SLAYER</h1>
    <input type="text" id="nameInput" class="name-input" maxlength="16" placeholder="ENTER NAME" />
    <button id="startBtn" class="start-btn">START BATTLE</button>
    <button id="muteBtn" style="margin-top:20px; font-size:12px; border:2px solid var(--white); padding:8px;">SOUND: ON</button>
  </div>


  <!-- SELECTION SCREEN -->
  <div id="selectionScreen" class="screen">
    <h1 class="game-title" style="font-size:32px;">CHOOSE PATH</h1>

    <div class="select-section-title">TINGKATAN (FORM)</div>
    <div class="select-grid" id="formGrid">
      <button class="select-btn form-btn" data-form="1">FORM 1</button>
      <button class="select-btn form-btn" data-form="2">FORM 2</button>
      <button class="select-btn form-btn" data-form="3">FORM 3</button>
      <button class="select-btn form-btn" data-form="4">FORM 4</button>
      <button class="select-btn form-btn" data-form="5">FORM 5</button>
    </div>

    <div class="select-section-title">SUBJECT</div>
    <div class="select-grid two-cols" id="subjectGrid">
      <button class="select-btn subj-btn" data-subject="mathematics">MATHEMATICS</button>
      <button class="select-btn subj-btn" data-subject="science">SCIENCE</button>
      <button class="select-btn subj-btn" data-subject="sejarah">SEJARAH</button>
      <button class="select-btn subj-btn" data-subject="physics">PHYSICS</button>
      <button class="select-btn subj-btn" data-subject="chemistry">CHEMISTRY</button>
      <button class="select-btn subj-btn" data-subject="biology">BIOLOGY</button>
    </div>

    <button id="confirmSelectBtn" class="start-btn" style="margin-top:auto;" disabled>FIGHT BOSS!</button>
  </div>

  <div id="battleScreen" class="screen">
    <div class="hp-top">
      <div class="hp-box">
        <div class="hp-label"><span id="bossHpName">BOSS</span> <span id="bossHpLabel">100/100</span></div>
        <div class="hp-bar-bg">
          <div class="hp-bar-fill red" id="bossHpFill"></div>
        </div>
      </div>
      <div class="hp-box">
        <div class="hp-label"><span id="playerHpName">PLAYER</span> <span id="playerHpLabel">100/100</span></div>
        <div class="hp-bar-bg">
          <div class="hp-bar-fill green" id="playerHpFill"></div>
        </div>
      </div>
    </div>

    <div class="battle-mid">
      <div class="arena" id="arena">
        <div class="boss-wrap" id="bossWrap"></div>
      </div>
      <div class="stats-bar">
        <div class="score-box">SCORE: <span id="scoreValue">0</span></div>
        <div class="combo-box">
          COMBO: <div class="combo-dots" id="comboDots"></div>
        </div>
        <div class="spells">
          <button class="spell" id="spell-fifty" data-spell="fifty">½</button>
          <button class="spell" id="spell-freeze" data-spell="freeze">❄</button>
          <button class="spell" id="spell-shield" data-spell="shield">🛡</button>
        </div>
      </div>
    </div>

    <div class="quiz-area">
      <div class="timer-wrap">
        <div class="timer-fill" id="timerFill"></div>
      </div>
      <div class="question-box" id="questionText"></div>
      <div class="options-grid" id="optionsGrid"></div>
    </div>
  </div>

  <div id="resultScreen" class="screen">
    <h1 id="resultTitle" class="result-title">VICTORY</h1>
    <div class="result-stats">
      <div>SCORE: <span id="finalScore">0</span></div>
      <div>ACCURACY: <span id="finalAccuracy">0%</span></div>
      <div>MAX COMBO: <span id="finalCombo">0</span></div>
    </div>

    <div class="leaderboard-wrap"
      style="width: 100%; max-width: 400px; margin: 0 auto; background: var(--purple); border: 4px solid var(--white); padding: 16px;">
      <h2 style="font-size: 16px; color: var(--gold); text-align: center; margin-top: 0; margin-bottom: 12px;">TOP
        SCORERS</h2>
      <div id="leaderboardList"
        style="display: flex; flex-direction: column; gap: 8px; font-size: 12px; text-align: left;">
      </div>
    </div>

    <div class="result-actions">
      <button id="retryBtn">RETRY</button>
      <button id="menuBtn">MENU</button>
      <button id="nextBossBtn">NEXT BOSS</button>
    </div>
  </div>

  <script>
    const QUESTIONS = [
      // === FORM 1 (EMBERLING) ===
      // Science (F1)
      { boss: "emberling", text: "What is the SI unit for temperature?", element: "ice", options: ["Celsius", "Fahrenheit", "Kelvin", "Joule"], answer: 2, category: "Science • Form 1" },
      { boss: "emberling", text: "Which of these is a non-renewable energy source?", element: "fire", options: ["Solar", "Wind", "Natural Gas", "Hydroelectric"], answer: 2, category: "Science • Form 1" },
      { boss: "emberling", text: "The process of a solid turning directly into a gas is called...", element: "fire", options: ["Melting", "Sublimation", "Evaporation", "Condensation"], answer: 1, category: "Science • Form 1" },
      { boss: "emberling", text: "Which cell structure controls all activities in the cell?", element: "fire", options: ["Cytoplasm", "Vacuole", "Nucleus", "Cell Wall"], answer: 2, category: "Science • Form 1" },
      { boss: "emberling", text: "What is the SI unit for length?", element: "fire", options: ["Centimeter", "Meter", "Kilometer", "Millimeter"], answer: 1, category: "Science • Form 1" },
      { boss: "emberling", text: "Which of these is a base quantity?", element: "fire", options: ["Volume", "Density", "Mass", "Force"], answer: 2, category: "Science • Form 1" },
      { boss: "emberling", text: "Density = Mass divided by ...?", element: "fire", options: ["Area", "Weight", "Volume", "Height"], answer: 2, category: "Science • Form 1" },
      { boss: "emberling", text: "Which part of the cell is known as the powerhouse?", element: "fire", options: ["Nucleus", "Ribosome", "Mitochondria", "Vacuole"], answer: 2, category: "Science • Form 1" },
      { boss: "emberling", text: "The state of matter with a fixed shape and volume is...", element: "fire", options: ["Solid", "Liquid", "Gas", "Plasma"], answer: 0, category: "Science • Form 1" },
      { boss: "emberling", text: "Which of these is an example of a vertebrate?", element: "fire", options: ["Earthworm", "Frog", "Snail", "Spider"], answer: 1, category: "Science • Form 1" },
      { boss: "emberling", text: "Which gas is needed for a fire to burn?", element: "fire", options: ["Nitrogen", "Carbon Dioxide", "Oxygen", "Helium"], answer: 2, category: "Science • Form 1" },
      { boss: "emberling", text: "The percentage of oxygen in the atmosphere is approximately...", element: "fire", options: ["78%", "21%", "1%", "0.03%"], answer: 1, category: "Science • Form 1" },
      // Mathematics (F1)
      { boss: "emberling", text: "What is the result of -12 + 7?", element: "lightning", calc: true, options: ["5", "-5", "-19", "19"], answer: 1, category: "Mathematics • Form 1" },
      { boss: "emberling", text: "Solve for x: 2x - 4 = 10", element: "lightning", calc: true, options: ["3", "5", "7", "14"], answer: 2, category: "Mathematics • Form 1" },
      { boss: "emberling", text: "Calculate the area of a triangle with base 6cm and height 4cm.", element: "lightning", calc: true, options: ["24 cm²", "10 cm²", "12 cm²", "48 cm²"], answer: 2, category: "Mathematics • Form 1" },
      { boss: "emberling", text: "Evaluate: -15 + (-8)", element: "lightning", calc: true, options: ["7", "-23", "23", "-7"], answer: 1, category: "Mathematics • Form 1" },
      { boss: "emberling", text: "Which is a prime number?", element: "lightning", options: ["15", "21", "2", "9"], answer: 2, category: "Mathematics • Form 1" },
      { boss: "emberling", text: "Find the Lowest Common Multiple (LCM) of 4 and 6.", element: "lightning", calc: true, options: ["2", "12", "24", "10"], answer: 1, category: "Mathematics • Form 1" },
      { boss: "emberling", text: "Simplify: 3x + 5y - 2x + y", element: "lightning", calc: true, options: ["x + 6y", "5x + 6y", "x + 4y", "5x + 4y"], answer: 0, category: "Mathematics • Form 1" },
      { boss: "emberling", text: "If a = 3 and b = -2, find the value of 2a - b.", element: "lightning", calc: true, options: ["4", "8", "7", "5"], answer: 1, category: "Mathematics • Form 1" },
      { boss: "emberling", text: "Find the perimeter of a square with side length 5cm.", element: "lightning", calc: true, options: ["10cm", "25cm", "20cm", "15cm"], answer: 2, category: "Mathematics • Form 1" },
      { boss: "emberling", text: "The sum of interior angles in a triangle is...", element: "lightning", options: ["90°", "180°", "270°", "360°"], answer: 1, category: "Mathematics • Form 1" },
      { boss: "emberling", text: "What is the square of 13?", element: "lightning", calc: true, options: ["144", "169", "196", "156"], answer: 1, category: "Mathematics • Form 1" },
      // Sejarah (F1)
      { boss: "emberling", text: "Siapakah yang digelar sebagai 'Bapa Sejarah'?", element: "fire", options: ["Herodotus", "Ibn Khaldun", "Aristotle", "Tun Sri Lanang"], answer: 0, category: "Sejarah • Form 1" },
      { boss: "emberling", text: "Manakah antara berikut merupakan sumber primer?", element: "fire", options: ["Buku teks", "Fosil", "Ensiklopedia", "Akhbar"], answer: 1, category: "Sejarah • Form 1" },
      { boss: "emberling", text: "Zaman Paleolitik juga dikenali sebagai...", element: "fire", options: ["Zaman Batu Lama", "Zaman Batu Baru", "Zaman Logam", "Zaman Gangsa"], answer: 0, category: "Sejarah • Form 1" },
      { boss: "emberling", text: "Apakah maksud 'Syajaratun' dalam bahasa Arab?", element: "fire", options: ["Sejarah", "Masa", "Pohon", "Kejadian"], answer: 2, category: "Sejarah • Form 1" },
      { boss: "emberling", text: "Zaman Air Batu Akhir dikenali sebagai Zaman...", element: "fire", options: ["Miosen", "Pliosen", "Pleistosen", "Holosen"], answer: 3, category: "Sejarah • Form 1" },

    // AUDIO SYSTEM
    const AudioEngine = {
      ctx: null,
      osc: null,
      gain: null,
      music: null,
      isMuted: false,
      
      init() {
        if (this.ctx) return;
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.music = new Audio('bgmusic.mp3');
        this.music.loop = true;
      },

      play(freq, type, duration, vol = 0.1) {
        if (this.isMuted) return;
        this.init();
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        g.gain.setValueAtTime(vol, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
        osc.connect(g);
        g.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + duration);
      },

      correct() {
        this.play(523.25, 'square', 0.1); // C5
        setTimeout(() => this.play(659.25, 'square', 0.2), 100); // E5
      },

      wrong() {
        this.play(220.00, 'sawtooth', 0.3); // A3
        setTimeout(() => this.play(110.00, 'sawtooth', 0.5), 50); // A2
      },

      startMusic() {
        this.init();
        if (this.isMuted) return;
        this.music.play().catch(e => console.log("Music play blocked"));
      },

      stopMusic() {
        if (this.music) {
          this.music.pause();
        }
      },

      toggleMute() {
        this.isMuted = !this.isMuted;
        if (this.isMuted) this.stopMusic();
        else {
          if (!document.getElementById('battleScreen').classList.contains('active')) {
            this.startMusic();
          }
        }
        return this.isMuted;
      }
    };

      </defs>
      <path d="M120 220 L60 220 L70 130 Q70 100 120 100 Q170 100 170 130 L180 220 Z" fill="url(#vbody)" stroke="${shade(color, -40)}" stroke-width="2"/>
      <ellipse cx="75" cy="130" rx="22" ry="14" fill="${shade(color, -20)}"/>
      <ellipse cx="165" cy="130" rx="22" ry="14" fill="${shade(color, -20)}"/>
      <ellipse cx="120" cy="80" rx="34" ry="40" fill="${shade(color, 40)}" stroke="${shade(color, -40)}" stroke-width="2"/>
      <path d="M88 55 L100 30 L112 50 L120 22 L128 50 L140 30 L152 55 Z" fill="${boss.accent}" stroke="#3a1f5f" stroke-width="2"/>
      <circle cx="120" cy="38" r="4" fill="#fff200" opacity="${glow}"/>
      <ellipse cx="106" cy="82" rx="6" ry="8" fill="#000"/>
      <ellipse cx="134" cy="82" rx="6" ry="8" fill="#000"/>
      <circle cx="106" cy="84" r="3" fill="${eyeColor}"/>
      <circle cx="134" cy="84" r="3" fill="${eyeColor}"/>
      <path d="M108 100 Q120 ${phase > 0 ? 108 : 104} 132 100" stroke="#1a0030" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <line x1="195" y1="50" x2="195" y2="220" stroke="#3a1f5f" stroke-width="6" stroke-linecap="round"/>
      <circle cx="195" cy="45" r="14" fill="url(#vorb)"/>
      <circle cx="195" cy="45" r="20" fill="${boss.accent}" opacity="0.3"/>
    </svg>`;
      }
      return `
  <svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="gbody" cx="50%" cy="40%">
        <stop offset="0%" stop-color="${shade(color, 40)}"/>
        <stop offset="100%" stop-color="${color}"/>
      </radialGradient>
      <radialGradient id="gice" cx="50%" cy="40%">
        <stop offset="0%" stop-color="#fff"/>
        <stop offset="100%" stop-color="${boss.accent}"/>
      </radialGradient>
    </defs>
    <path d="M120 220 L55 220 L75 140 Q75 110 120 110 Q165 110 165 140 L185 220 Z" fill="url(#gbody)" stroke="${shade(color, -30)}" stroke-width="2"/>
    <polygon points="90,200 95,180 100,200" fill="${boss.accent}" opacity="0.7"/>
    <polygon points="140,210 145,185 150,210" fill="${boss.accent}" opacity="0.7"/>
    <ellipse cx="120" cy="85" rx="32" ry="38" fill="url(#gice)" stroke="${shade(color, -30)}" stroke-width="2"/>
    <path d="M88 75 L82 130 L92 100 Z" fill="${shade(color, 30)}"/>
    <path d="M152 75 L158 130 L148 100 Z" fill="${shade(color, 30)}"/>
    <path d="M90 60 L98 30 L108 55 L118 25 L128 55 L138 30 L150 60 Z" fill="${boss.accent}" stroke="#fff" stroke-width="1.5" opacity="0.95"/>
    <circle cx="118" cy="35" r="4" fill="#a3e4ff" opacity="${glow}"/>
    <ellipse cx="108" cy="88" rx="5" ry="7" fill="#000"/>
    <ellipse cx="132" cy="88" rx="5" ry="7" fill="#000"/>
    <circle cx="108" cy="90" r="2.5" fill="${eyeColor}"/>
    <circle cx="132" cy="90" r="2.5" fill="${eyeColor}"/>
    <path d="M110 105 Q120 ${phase > 0 ? 100 : 108} 130 105" stroke="#1a2a40" stroke-width="2" fill="none" stroke-linecap="round"/>
    <line x1="40" y1="60" x2="40" y2="220" stroke="#2c5d8a" stroke-width="5"/>
    <polygon points="40,40 30,65 50,65" fill="${boss.accent}" stroke="#fff" stroke-width="1"/>
    <circle cx="40" cy="55" r="16" fill="${boss.accent}" opacity="0.35"/>
  </svg>`;
    }

    function shade(hex, percent) {
      const h = hex.replace('#', '');
      let r = parseInt(h.substr(0, 2), 16), g = parseInt(h.substr(2, 2), 16), b = parseInt(h.substr(4, 2), 16);
      r = Math.max(0, Math.min(255, r + Math.round(255 * percent / 100)));
      g = Math.max(0, Math.min(255, g + Math.round(255 * percent / 100)));
      b = Math.max(0, Math.min(255, b + Math.round(255 * percent / 100)));
      return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
    }


    function goToSelection() {
      const nameEl = document.getElementById('nameInput');
      const name = nameEl.value.trim();
      if (!name) {
        nameEl.focus();
        return;
      }
      state.playerName = name;
      AudioEngine.startMusic();
      document.getElementById('titleScreen').classList.remove('active');
      document.getElementById('selectionScreen').classList.add('active');
    }

    document.querySelectorAll('.form-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.form-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.selectedForm = parseInt(btn.dataset.form);

        // Disable physics, chemistry, biology for forms 1-3
        const isUpper = state.selectedForm >= 4;
        document.querySelectorAll('.subj-btn').forEach(sb => {
          const subj = sb.dataset.subject;
          if (['physics', 'chemistry', 'biology'].includes(subj)) {
            sb.disabled = !isUpper;
            if (!isUpper && sb.classList.contains('active')) {
              sb.classList.remove('active');
              state.selectedSubject = null;
            }
          }
        });
        checkConfirm();
      });
    });

    document.querySelectorAll('.subj-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.disabled) return;
        document.querySelectorAll('.subj-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.selectedSubject = btn.dataset.subject;
        checkConfirm();
      });
    });

    function checkConfirm() {
      document.getElementById('confirmSelectBtn').disabled = !(state.selectedForm && state.selectedSubject);
    }

    document.getElementById('confirmSelectBtn').onclick = () => {
      state.selectedBossIdx = state.selectedForm - 1;
      startBattle();
    };

    function startBattle() {
      const nameEl = document.getElementById('nameInput');
      const name = nameEl.value.trim();
      if (!name) {
        nameEl.focus();
        return;
      }
      state.playerName = name;
      state.currentBoss = BOSSES[state.selectedBossIdx];
      state.bossMaxHp = state.currentBoss.maxHp;
      state.bossHp = state.bossMaxHp;
      state.playerHp = 100; state.playerMaxHp = 100;
      state.combo = 0; state.maxCombo = 0; state.score = 0;
      state.correctAnswers = 0; state.totalAnswers = 0;
      state.phase = 0;
      state.questionIndex = 0; state.shielded = false; state.frozen = false;
      state.spellsUsed = {};
      state.questionPool = shuffle(QUESTIONS.filter(q => {
        const isRightBoss = q.boss === state.currentBoss.id;
        const isRightSubj = q.category.toLowerCase().includes(state.selectedSubject);
        return isRightBoss && isRightSubj;
      }));

      // fallback if no questions found
      if (state.questionPool.length === 0) {
        state.questionPool = [{ boss: state.currentBoss.id, text: "No questions found for this subject. Play anyway?", element: "fire", options: ["OK", "Yes", "Sure", "Alright"], answer: 0, category: "" }];
      }

      document.getElementById('selectionScreen').classList.remove('active');
      document.getElementById('titleScreen').classList.remove('active');
      document.getElementById('resultScreen').classList.remove('active');
      document.getElementById('battleScreen').classList.add('active');
      AudioEngine.stopMusic();

      renderBoss();
      renderHpBars();
      renderCombo();
      renderScore();
      renderSpells();
      nextQuestion();
    }

    function renderBoss() {
      const b = state.currentBoss;
      document.getElementById('bossHpName').textContent = b.name.toUpperCase();
      document.getElementById('playerHpName').textContent = state.playerName.toUpperCase();
      const wrap = document.getElementById('bossWrap');
      wrap.innerHTML = bossSvg(b, state.phase);
      wrap.className = 'boss-wrap';
    }

    function renderHpBars() {
      const bp = Math.max(0, state.bossHp / state.bossMaxHp * 100);
      const pp = Math.max(0, state.playerHp / state.playerMaxHp * 100);
      document.getElementById('bossHpFill').style.width = bp + '%';
      document.getElementById('playerHpFill').style.width = pp + '%';
      document.getElementById('bossHpLabel').textContent = `${Math.max(0, Math.ceil(state.bossHp))}/${state.bossMaxHp}`;
      document.getElementById('playerHpLabel').textContent = `${Math.max(0, Math.ceil(state.playerHp))}/${state.playerMaxHp}`;
    }

    function renderCombo() {
      const dots = document.getElementById('comboDots');
      dots.innerHTML = '';
      for (let i = 0; i < 4; i++) {
        const d = document.createElement('div');
        d.className = 'combo-dot' + (i < state.combo ? ' on' : '');
        dots.appendChild(d);
      }
    }

    function renderScore() {
      document.getElementById('scoreValue').textContent = state.score.toLocaleString();
    }

    function renderSpells() {
      const reqs = { fifty: 2, freeze: 3, shield: 4 };
      Object.keys(reqs).forEach(s => {
        const btn = document.getElementById('spell-' + s);
        const used = state.spellsUsed[s];
        btn.disabled = state.combo < reqs[s] || used || state.answered;
      });
    }

    function nextQuestion() {
      if (state.bossHp <= 0) { endBattle(true); return; }
      if (state.playerHp <= 0) { endBattle(false); return; }

      state.answered = false;
      state.frozen = false;

      if (state.questionIndex >= state.questionPool.length) {
        state.questionPool = shuffle(QUESTIONS.filter(q => q.boss === state.currentBoss.id));
        state.questionIndex = 0;
      }
      const q = state.questionPool[state.questionIndex++];

      document.getElementById('questionText').textContent = q.text;

      const grid = document.getElementById('optionsGrid');
      grid.innerHTML = '';
      q.options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'option';
        btn.innerHTML = `<span class="key">${'ABCD'[i]}</span><span>${opt}</span>`;
        btn.onclick = () => answer(i, q);
        grid.appendChild(btn);
      });

      let phaseTime = 15;
      if (q.calc) phaseTime += 10;
      state.timerValue = phaseTime;
      state._timerMax = phaseTime;
      state.questionStart = Date.now();
      startTimer();
      renderSpells();
    }

    function startTimer() {
      clearInterval(state.timerRef);
      const fill = document.getElementById('timerFill');
      state.timerRef = setInterval(() => {
        if (state.frozen || state.answered) return;
        state.timerValue -= 0.1;
        const pct = Math.max(0, state.timerValue / state._timerMax * 100);
        fill.style.width = pct + '%';
        if (state.timerValue <= 0) {
          clearInterval(state.timerRef);
          timeout();
        }
      }, 100);
    }

    function answer(idx, q) {
      if (state.answered) return;
      state.answered = true;
      clearInterval(state.timerRef);

      const btns = document.querySelectorAll('.option');
      btns.forEach(b => b.disabled = true);

      if (idx === q.answer) {
        btns[idx].classList.add('correct');
        document.getElementById('arena').classList.add('flash-green');
        setTimeout(() => document.getElementById('arena').classList.remove('flash-green'), 300);
        AudioEngine.correct();
        correctHit(q);
      } else {
        btns[q.answer].classList.add('correct');
        btns[idx].classList.add('wrong');
        AudioEngine.wrong();
        document.body.classList.add('shake-screen');
        document.getElementById('arena').classList.add('flash-red');
        setTimeout(() => {
          document.body.classList.remove('shake-screen');
          document.getElementById('arena').classList.remove('flash-red');
        }, 400);
        wrongHit();
      }

      setTimeout(nextQuestion, 1300);
    }

    function timeout() {
      if (state.answered) return;
      state.answered = true;
      const btns = document.querySelectorAll('.option');
      const q = state.questionPool[state.questionIndex - 1];
      btns.forEach(b => b.disabled = true);
      if (q) btns[q.answer].classList.add('correct');
      AudioEngine.wrong();

      document.body.classList.add('shake-screen');
      document.getElementById('arena').classList.add('flash-red');
      setTimeout(() => {
        document.body.classList.remove('shake-screen');
        document.getElementById('arena').classList.remove('flash-red');
      }, 400);
      wrongHit();

      setTimeout(nextQuestion, 1300);
    }

    function correctHit(q) {
      state.correctAnswers++;
      state.totalAnswers++;
      state.combo++;
      if (state.combo > state.maxCombo) state.maxCombo = state.combo;

      const elapsed = (Date.now() - state.questionStart) / 1000;
      const isCrit = elapsed <= 3;
      const isWeak = q.element === state.currentBoss.weakness;

      let mult = 1;
      if (state.combo >= 5) mult = 3;
      else if (state.combo >= 3) mult = 2;

      const weakBonus = isWeak ? 1.5 : 1;
      const critBonus = isCrit ? 1.5 : 1;

      let baseDmg = 60;
      let dmg = Math.round(baseDmg * mult * weakBonus * critBonus);
      let scoreAdd = Math.round(20 * mult * weakBonus * critBonus);

      state.bossHp -= dmg;
      state.score += scoreAdd;

      const wrap = document.getElementById('bossWrap');
      wrap.classList.remove('hit');
      void wrap.offsetWidth;
      wrap.classList.add('hit');

      showDamage(dmg);

      renderHpBars();
      renderScore();
      renderCombo();
      renderSpells();
    }

    function wrongHit() {
      state.totalAnswers++;
      state.combo = 0;
      if (state.shielded) {
        state.shielded = false;
        renderCombo(); renderSpells();
        return;
      }
      state.playerHp -= 25;
      if (state.playerHp < 0) state.playerHp = 0;

      const wrap = document.getElementById('bossWrap');
      wrap.classList.remove('attack');
      void wrap.offsetWidth;
      wrap.classList.add('attack');

      renderHpBars(); renderCombo(); renderSpells();
    }

    function showDamage(dmg) {
      const area = document.getElementById('arena');
      const el = document.createElement('div');
      el.className = 'damage-num';
      el.textContent = '-' + dmg;
      area.appendChild(el);
      setTimeout(() => el.remove(), 1000);
    }

    function castSpell(spell) {
      const reqs = { fifty: 2, freeze: 3, shield: 4 };
      if (state.combo < reqs[spell] || state.spellsUsed[spell] || state.answered) return;
      state.combo -= reqs[spell];
      state.spellsUsed[spell] = true;

      if (spell === 'fifty') {
        const q = state.questionPool[state.questionIndex - 1];
        const wrongs = [];
        document.querySelectorAll('.option').forEach((b, i) => {
          if (i !== q.answer) wrongs.push({ el: b, i });
        });
        shuffle(wrongs).slice(0, 2).forEach(w => w.el.classList.add('eliminated'));
      } else if (spell === 'freeze') {
        state.frozen = true;
        setTimeout(() => { state.frozen = false; }, 5000);
      } else if (spell === 'shield') {
        state.shielded = true;
      }
      renderCombo();
      renderSpells();
    }

    document.addEventListener('click', (e) => {
      const sp = e.target.closest('.spell');
      if (sp) castSpell(sp.dataset.spell);
    });

    document.addEventListener('keydown', (e) => {
      if (!document.getElementById('battleScreen').classList.contains('active')) return;
      if (['1', '2', '3', '4'].includes(e.key)) {
        const idx = parseInt(e.key) - 1;
        const opts = document.querySelectorAll('.option');
        if (opts[idx] && !opts[idx].disabled && !opts[idx].classList.contains('eliminated')) {
          opts[idx].click();
        }
      }
      if (e.code === 'Space') {
        e.preventDefault();
        const order = ['fifty', 'freeze', 'shield'];
        for (const s of order) {
          const btn = document.getElementById('spell-' + s);
          if (btn && !btn.disabled) { btn.click(); break; }
        }
      }
    });

    function endBattle(victory) {
      clearInterval(state.timerRef);
      state.answered = true;

      if (victory) {
        const wrap = document.getElementById('bossWrap');
        wrap.classList.add('defeat');
        setTimeout(() => showResult(true), 1500);
      } else {
        setTimeout(() => showResult(false), 1000);
      }
    }

    function showResult(victory) {
      document.getElementById('battleScreen').classList.remove('active');
      document.getElementById('resultScreen').classList.add('active');

      const title = document.getElementById('resultTitle');
      if (victory) {
        title.textContent = 'VICTORY!';
        title.className = 'result-title victory';
      } else {
        title.textContent = 'DEFEATED';
        title.className = 'result-title defeat';
      }

      document.getElementById('finalScore').textContent = state.score.toLocaleString();
      const acc = state.totalAnswers > 0 ? Math.round((state.correctAnswers / state.totalAnswers) * 100) : 0;
      document.getElementById('finalAccuracy').textContent = acc + '%';
      document.getElementById('finalCombo').textContent = state.maxCombo;

      // Update Leaderboard
      window.currentLeaderboard = window.currentLeaderboard || [...SEED_LEADERBOARD];
      if (state.score > 0) {
        const existingIdx = window.currentLeaderboard.findIndex(e => e.name === state.playerName);
        if (existingIdx >= 0) {
          if (state.score > window.currentLeaderboard[existingIdx].score) {
            window.currentLeaderboard[existingIdx].score = state.score;
          }
        } else {
          window.currentLeaderboard.push({ name: state.playerName, element: state.currentBoss.weakness, score: state.score, title: "Scholar" });
        }
      }
      window.currentLeaderboard.sort((a, b) => b.score - a.score);

      const lbList = document.getElementById('leaderboardList');
      lbList.innerHTML = '';

      const renderEntry = (entry, rank) => {
        const el = document.createElement('div');
        el.style.display = 'flex';
        el.style.justifyContent = 'space-between';
        const isPlayer = entry.name === state.playerName;
        el.innerHTML = `<span style="${isPlayer ? 'color:var(--green)' : ''}">${rank}. ${entry.name}</span> <span style="color:var(--gold)">${entry.score.toLocaleString()}</span>`;
        lbList.appendChild(el);
      };

      window.currentLeaderboard.slice(0, 5).forEach((entry, i) => {
        renderEntry(entry, i + 1);
      });

      const playerIdx = window.currentLeaderboard.findIndex(e => e.name === state.playerName);
      if (playerIdx >= 5) {
        const sep = document.createElement('div');
        sep.style.textAlign = 'center';
        sep.style.opacity = '0.5';
        sep.textContent = '...';
        lbList.appendChild(sep);
        renderEntry(window.currentLeaderboard[playerIdx], playerIdx + 1);
      }

      const nextBtn = document.getElementById('nextBossBtn');
      const retryBtn = document.getElementById('retryBtn');

      if (victory && BOSSES.length > state.selectedBossIdx + 1) {
        nextBtn.style.display = 'inline-block';
        retryBtn.style.display = 'none';
      } else {
        nextBtn.style.display = 'none';
        retryBtn.style.display = 'inline-block';
      }
    }

    document.getElementById('retryBtn').onclick = startBattle;
    document.getElementById('nextBossBtn').onclick = () => {
      state.selectedBossIdx++;
      startBattle();
    };
    document.getElementById('menuBtn').onclick = () => {
      document.getElementById('resultScreen').classList.remove('active');
      document.getElementById('titleScreen').classList.add('active');
      AudioEngine.startMusic();
    };

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    document.getElementById('startBtn').onclick = goToSelection;

    document.getElementById('muteBtn').onclick = () => {
      const muted = AudioEngine.toggleMute();
      document.getElementById('muteBtn').textContent = muted ? 'SOUND: OFF' : 'SOUND: ON';
    };

    document.getElementById('nameInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') goToSelection();
    });
  </script>
</body>

</html>
